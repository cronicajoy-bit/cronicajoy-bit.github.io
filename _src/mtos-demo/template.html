<title>M-TOS 홈 시연</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
{{FONTS}}
/* Layout: presentation stage — phone device on the left, demo control panel on the right; on phones the app fills the screen. Single deliberate light look. */
:root{
  --lime:#D2F56C; --lime-deep:#D9F84A; --navy:#2E3A4F; --orange:#FF5729; --ink:#111111;
  --sub:#8E9196; --mid:#5F6368; --icon:#4E5560; --line:#E3E6EA; --gray:#F2F2F2; --chipline:#E9ECF1;
  --stage:#A39F9A; --stage-ink:#23272E; --panel:#FFFFFF;
  --font:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:88px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device-wrap{flex:none;position:relative}
.device{width:390px;height:844px;border-radius:52px;transform-origin:top left;position:absolute;left:0;top:0;}
.device::before{display:none}
.device .btn-side,.island{display:none}
.device .btn-side{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#1A1B1D,#4A4B4F,#1A1B1D)}
.device .b1{left:-3px;top:150px;height:34px}.device .b2{left:-3px;top:215px;height:62px}.device .b3{left:-3px;top:290px;height:62px}.device .b4{right:-3px;top:250px;height:96px}
.screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#fff;z-index:1}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:20}
.island::after{content:"";position:absolute;right:22px;top:12px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2B3A55,#0A0D14 60%)}
.panel{width:340px;flex:none;display:flex;flex-direction:column;gap:22px}
.panel h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.25;text-wrap:balance}
.panel .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:#4A5530;text-transform:uppercase;margin-bottom:6px}
.panel p{margin:0;font-size:14px;line-height:1.6;color:#4B5563}
.times{display:flex;flex-direction:column;gap:8px}
.time-btn{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:12px;text-align:left;background:var(--panel);border-radius:16px;padding:12px 14px;border:1.5px solid transparent;transition:border-color .15s,background .15s}
.time-btn .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.time-btn .d{font-size:13px;font-weight:600;color:#4B5563;line-height:1.35}
.time-btn .d b{display:block;color:var(--ink);font-size:15px;font-weight:700}
.time-btn[aria-pressed="true"]{border-color:var(--navy);background:#fff;box-shadow:0 6px 18px rgba(46,58,79,.12)}
.time-btn[aria-pressed="true"] .t{color:var(--navy)}
.time-btn:hover{border-color:#C8CDD4}
/* presentation panel — warm gray stage, pill time buttons */
.panel{width:308px;gap:18px}
.panel h1{font-size:24px;font-weight:600;color:#F7F5F2;letter-spacing:-.02em;padding-left:12px}
.panel .times{gap:12px}
.panel .time-btn{grid-template-columns:auto 1fr;gap:28px;height:80px;padding:0 30px;border-radius:40px;border:0;background:#D2CFCB;box-shadow:none;transition:background .2s}
.panel .time-btn .t{font-size:27px;font-weight:600;color:#A29E99;letter-spacing:0}
.panel .time-btn .t i{font-style:normal;padding:0 3px;position:relative;top:-2px}
.panel .time-btn .d{font-size:12px;font-weight:500;color:#A29E99;line-height:1.4}
.panel .time-btn .d b{font-size:18px;font-weight:700;color:#A29E99;margin-bottom:1px}
.panel .time-btn:hover{background:#DCD9D6}
.panel .time-btn[aria-pressed="true"]{background:#fff}
.panel .time-btn[aria-pressed="true"] .t,.panel .time-btn[aria-pressed="true"] .d,.panel .time-btn[aria-pressed="true"] .d b{color:#111}
.scene{background:var(--navy);color:#fff;border-radius:18px;padding:16px 18px}
.scene .k{font-size:12px;font-weight:700;color:var(--lime);margin-bottom:6px}
.scene .v{font-size:14px;line-height:1.6}
.hint{font-size:12px;color:#4A5530}
.hint kbd{font-family:inherit;background:#fff;border-radius:6px;padding:1px 6px;border:1px solid #D5D8DD}

/* ---------- app ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.statusbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font-size:16px;font-weight:600;background:#fff;z-index:5}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:10px 22px 0 26px}
.store{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.hicons{display:flex;gap:18px;align-items:center}
.hicon{position:relative;width:26px;height:26px;display:grid;place-items:center}
.hicon .dot{position:absolute;top:1px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--orange);border:1.5px solid #fff}
.hicon .badge{position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.sec-title{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:800;letter-spacing:-.03em;padding:50px 26px 22px}
.sec-title.first{padding-top:18px;padding-bottom:14px}
.sec-title .cnt{color:var(--orange)}
.sec-title .more{margin-left:auto;font-size:14px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:2px;letter-spacing:0}

/* hero */
.hero-wrap{padding:0 22px}
.hero{background:var(--lime);border-radius:30px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.hero .label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.13)}
.hero .label i{width:6px;height:6px;border-radius:50%;background:var(--orange);flex:none}
.hero h2{margin:0;font-size:23px;line-height:1.36;font-weight:700;letter-spacing:-.03em}
.nums{display:flex;justify-content:space-between;align-items:flex-end}
.nums .l small,.nums .r small{display:block;font-size:12px;font-weight:500;margin-bottom:2px}
.nums .l b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.nums .r{text-align:right}
.nums .r b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.rail{position:relative;width:302px;height:80px;align-self:center}
.rail .base{position:absolute;left:0;top:45px;width:293px;height:10px;border-radius:5px;background:rgba(46,58,79,.16)}
.rail .prog{position:absolute;left:0;top:45px;height:10px;border-radius:5px;background:var(--navy)}
.rail .arrival{position:absolute;left:281px;top:39px;width:21px;height:21px;border-radius:50%;background:var(--navy);display:grid;place-items:center;border:2.3px solid var(--navy)}
.rail .pin{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.rail .pin span{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap}
.rail .passed{position:absolute;top:47px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9)}
.rail .tick{position:absolute;top:46px;width:8px;height:8px;border-radius:50%;background:#fff;border:1.5px solid var(--navy)}
.rail .cap{position:absolute;right:0;top:68px;font-size:12px;font-weight:500}
.cargo{position:absolute;pointer-events:none}
.cargo img{position:absolute;display:block;max-width:none}
.actions{display:flex;gap:8px}
.btn{height:54px;border-radius:27px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:-.02em}
.btn.primary{flex:1;background:var(--navy);color:#fff}
.btn.secondary{background:#fff;padding:0 22px}
.insight{display:flex;align-items:center;gap:8px;padding-top:2px}
.wchip{display:flex;align-items:center;gap:5px;background:#fff;border-radius:20px;padding:4px 10px;flex:none;font-size:13px;font-weight:700}
.insight .txt{flex:1;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* weather icon */
.wx{position:relative;width:21px;height:21px;flex:none}
.wx img{position:absolute;left:0;top:0;width:19.6px;height:13px}
.wx i{position:absolute;width:1.6px;height:5px;border-radius:1px;background:#2F80ED;transform:rotate(15deg);opacity:0;animation:drop 1s linear infinite}
.wx i:nth-of-type(1){left:5px;animation-delay:0s}
.wx i:nth-of-type(2){left:9.5px;animation-delay:.33s}
.wx i:nth-of-type(3){left:14px;animation-delay:.66s}
@keyframes drop{0%{top:9px;opacity:0}20%{opacity:1}75%{opacity:1}100%{top:19px;opacity:0}}

/* task card & lists */
.now{padding:16px 22px 0}
.task-card{border-radius:22px;padding:16px 14px 16px 10px;display:flex;flex-direction:column;gap:16px;background:#ECECEC}
.task-card .ttext span,.task-card .ttext span.warn{color:#B1705E;font-weight:500}
.task-card .pill{background:#fff}
.task-card .ticon,.task-card .tdate{color:#292C31}
.row{display:flex;align-items:center;gap:15px}
.ticon{width:40px;flex:none;display:grid;place-items:center;color:var(--icon)}
.tdate{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;color:var(--icon)}
.tdate small{font-size:11px;font-weight:600}
.tdate b{font-size:20px;font-weight:700;line-height:1.2}
.ttext{flex:1;min-width:0}
.ttext b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttext span{display:block;font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttext span.warn{color:var(--orange);font-weight:500}
.pill{height:34px;padding:0 12px;border-radius:17px;background:var(--gray);font-size:13px;font-weight:600;flex:none}
.link{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--navy);flex:none}
.soon{display:flex;flex-direction:column;gap:18px;padding:0 22px}
.soon .ticon,.soon .tdate{color:#292C31}
.soon .link{color:#8E9196}

/* banner */
.banner-wrap{padding:50px 22px 0}
.banner{position:relative;height:180px;border-radius:22px;overflow:hidden}
.btrack{display:flex;height:100%;transition:transform .45s cubic-bezier(.45,0,.2,1)}
.slide{flex:none;width:100%;height:100%;position:relative;padding:29px 20px}
.slide .tag{display:inline-block;background:rgba(255,255,255,.8);color:#B26A00;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px}
.slide h3{margin:6px 0 0;font-size:18px;font-weight:700;line-height:1.4;letter-spacing:-.02em}
.slide p{margin:5px 0 0;font-size:12px;font-weight:500}
.slide .circle{position:absolute;right:16px;top:27px;width:126px;height:126px;border-radius:50%;overflow:hidden}
.slide .circle img{width:100%;height:100%;display:block}
.bctl{position:absolute;left:20px;bottom:24px;display:flex;align-items:center;gap:10px;height:21px;padding:0 10px;border-radius:11px;background:rgba(18,18,18,.2);color:#fff;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;z-index:2}
.bctl button{color:#fff;display:grid;place-items:center;height:21px}

/* recommend */
.chips{display:flex;gap:8px;padding:0 22px 18px;overflow-x:auto;scrollbar-width:none;cursor:grab;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.chips.drag{cursor:grabbing;scroll-behavior:auto}
.chips.drag .chip{pointer-events:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:10px;height:56px;padding:8px 18px 8px 8px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--chipline);text-align:left;color:#111}
.chip{background:#F3F3F3;box-shadow:none}
.chip[aria-pressed="true"]{background:#fff;box-shadow:inset 0 0 0 2px #292C31}
.chip[aria-pressed="true"] span span{color:#4A5160}
.chip .th{width:40px;height:40px;padding:2px;flex:none}
.chip .th img{width:36px;height:36px;border-radius:14px;object-fit:cover;display:block}
.chip b{display:block;font-size:15px;font-weight:700;line-height:18px;color:#111;letter-spacing:0}
.chip span span{display:block;font-size:12px;font-weight:500;line-height:14px;color:var(--mid);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,108px);column-gap:11px;row-gap:22px;padding:0 22px}
.card img{width:108px;height:108px;border-radius:10px;object-fit:cover;display:block}
.card .im{position:relative}
.card .new{position:absolute;left:6px;top:6px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px}
.card .nm{margin-top:10px;font-size:14px;line-height:1.35;letter-spacing:-.02em}
.card .pr{font-size:18px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.card .ds{font-size:12px;color:var(--mid);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spacer{height:180px}

/* bottom */
.bnb{position:absolute;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.scrim{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.2));pointer-events:none;z-index:4}
.scrim{display:none}
.mini{pointer-events:auto;margin:0 22px;height:48px;background:var(--lime);border-radius:22px 22px 0 0;display:flex;align-items:center;gap:8px;padding:0 20px;box-shadow:0 16px 16px rgba(0,0,0,.1),inset 0 -2px 1px rgba(0,0,0,.05);transform:translateY(48px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;width:calc(100% - 44px);text-align:left}
.mini.on{transform:none;opacity:1}
.mini .mth{width:34px;height:34px;flex:none;position:relative}
.mini .mth img{position:absolute;display:block;max-width:none}
.hicon .badge[hidden]{display:none}
.mini .mtx{color:#111;flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden}
.mini .mtx em{font-style:normal;font-weight:700}
.mini .tp{background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.mini .bar{width:44px;height:4px;border-radius:2px;background:rgba(46,58,79,.18);position:relative;flex:none;overflow:hidden}
.mini .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:2px}
.tabbar{pointer-events:auto;height:84px;background:#fff;display:flex;padding:6px 12px 26px;position:relative;box-shadow:inset 0 1px 0 rgba(0,0,0,.06)}
.tabbar::after{content:"";position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111;display:none}
@media (max-width:760px){.tabbar::after{display:none}}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--icon)}
.tab[aria-current="page"]{color:var(--navy);font-weight:700}

/* cargo animations */
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.c15 .bk{animation:bkHop 1.6s ease-in-out infinite}
.c15 .v1{animation:vHop1 1.6s ease-in-out infinite}
.c15 .v2{animation:vHop2 1.6s ease-in-out infinite}
.c15 .v3{animation:vHop3 1.6s ease-in-out infinite}
@keyframes bkHop{0%,100%{transform:none}14%{transform:translateY(1.4px) scaleY(.97)}34%{transform:translateY(-4.8px)}52%{transform:translateY(.3px)}64%{transform:none}}
@keyframes vHop1{0%,100%{transform:rotate(-4deg)}14%{transform:translateY(2.8px) rotate(-4deg)}36%{transform:translateY(-12.4px) rotate(-9deg)}56%{transform:translateY(-3.4px) rotate(-6deg)}70%{transform:translateY(1.6px) rotate(-3deg)}82%{transform:rotate(-4deg)}}
@keyframes vHop2{0%,100%{transform:rotate(5deg)}16%{transform:translateY(2.8px) rotate(5deg)}40%{transform:translateY(-5.4px) rotate(7deg)}60%{transform:translateY(-5.6px) rotate(11deg)}74%{transform:translateY(-2.2px) rotate(8deg)}86%{transform:rotate(5deg)}}
@keyframes vHop3{0%,100%{transform:none}18%{transform:translateY(2.8px)}44%{transform:translateY(-4.2px) rotate(2deg)}62%{transform:translateY(-.8px) rotate(3deg)}78%{transform:translateY(-5.3px) rotate(8deg)}90%{transform:none}}

.c07 .tlow{animation:t07a 5.2s infinite}
.c07 .car{animation:t07b 5.2s infinite}
.c07 .bk{animation:t07k 5.2s infinite}
@keyframes t07a{0%,6%{transform:translateY(-46px) rotate(-10deg);opacity:0}8%{opacity:1}20%{transform:translateY(0) rotate(6deg);animation-timing-function:ease-out}25%{transform:translateY(2.5px) rotate(0)}30%,92%{transform:none;opacity:1}100%{transform:none;opacity:0}}
@keyframes t07b{0%,34%{transform:translateY(-44px) rotate(-8deg);opacity:0}36%{opacity:1}48%{transform:translateY(1px) rotate(8deg)}53%{transform:translateY(3.5px) rotate(4deg)}58%,92%{transform:rotate(5deg);opacity:1}100%{transform:rotate(5deg);opacity:0}}
@keyframes t07k{0%,19%{transform:none}23%{transform:translateY(2.5px) scaleY(.96)}29%{transform:none}48%{transform:none}52%{transform:translateY(2.5px) scaleY(.96)}58%,100%{transform:none}}

.c19 .veg{animation:s19v 4.8s infinite}
.c19 .bk{animation:s19b 4.8s infinite}
.c19 .closed{animation:s19c 4.8s infinite}
.c19 .sealed{animation:s19s 4.8s infinite}
@keyframes s19v{0%,24%{transform:none;opacity:1}36%{transform:translateY(12px);opacity:1}42%,100%{transform:translateY(12px);opacity:0}}
@keyframes s19b{0%,36%{opacity:1}44%,96%{opacity:0}100%{opacity:1}}
@keyframes s19c{0%,36%{opacity:0;transform:translateY(-3px) scale(.96)}46%,96%{opacity:1;transform:none}100%{opacity:0}}
@keyframes s19s{0%,50%{clip-path:inset(0 100% 0 0);opacity:1}66%,94%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}

.c06 .body{animation:tkBody .68s ease-in-out infinite}
.c06 .wh{animation:spin .68s linear infinite}
.c06 .p1{animation:puff1 .68s linear infinite}
.c06 .p2{animation:puff2 .68s linear infinite}
@keyframes tkBody{0%,100%{transform:none}50%{transform:translateY(-3px)}}
@keyframes spin{to{transform:rotate(-360deg)}}
@keyframes puff1{0%{transform:translate(6px,1px) scale(.45);opacity:.3}25%{opacity:1}100%{transform:translate(-4px,-1.5px) scale(1.15);opacity:.65}}
@keyframes puff2{0%{transform:translate(-4px,-1.5px) scale(1.15);opacity:.65}100%{transform:translate(-14px,-3.5px) scale(1.35);opacity:0}}

.cAR .box{animation:arDrop 3.4s infinite}
@keyframes arDrop{0%{transform:translateY(-24px);opacity:0}6%{opacity:1}22%{transform:translateY(0);animation-timing-function:ease-out}27%{transform:translateY(2px) scaleY(.95)}33%,92%{transform:none;opacity:1}100%{transform:none;opacity:0}}

/* mobile: full-bleed app */
.fab{display:none}
@media (max-width:760px){
  .stage{padding:0;gap:0;display:block}
  .panel{display:none}
  .device-wrap{width:100%!important;height:100%!important}
  .device{position:static;transform:none!important;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:#fff}
  .device::before,.device .btn-side,.island{display:none}
  .screen{width:100%;height:100%;border-radius:0}
  .statusbar{display:none}
  .app{padding-top:env(safe-area-inset-top,0px)}
  .fab{display:flex;position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(146px + env(safe-area-inset-bottom,0px));z-index:50;background:rgba(46,58,79,.88);color:#fff;font-size:12px;font-weight:700;border-radius:14px;padding:6px 10px;gap:4px;align-items:center}
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
  .sheet .inner{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
}

   <div class="bk" style="position:absolute;left:0;top:0;width:54px;height:65px;transform-origin:50% 92%">${im('basket',2,28,50,31)}</div></div>`;}
 if(s.cargo==='c07'){return `<div class="cargo c07" style="left:${s.cx}px;top:${s.cy}px;width:54px;height:65px">
   <div class="car" style="position:absolute;left:0;top:0;width:54px;height:65px">${im('carrot',21,15,19,25,'','transform:rotate(5deg)')}</div>
   ${im('lettuce',7.8,21.8,26,26,'','transform:rotate(-6deg)')}
   <div class="tlow" style="position:absolute;left:0;top:0;width:54px;height:65px">${im('tomato',27,32,21,22)}</div>
   <div class="bk" style="position:absolute;left:0;top:0;width:54px;height:65px;transform-origin:50% 92%">${im('basket',2,28,50,31)}</div></div>`;}
 if(s.cargo==='c19'){return `<div class="cargo c19" style="left:${s.cx}px;top:${s.cy}px;width:54px;height:65px">
   <div class="veg" style="position:absolute;inset:0">${im('lettuce',6.8,11.2,26,26,'','transform:rotate(-4deg)')}${im('carrot',17.9,12.9,19,25,'','transform:rotate(5deg)')}${im('tomato',27,17,21,22)}</div>
   <div class="bk" style="position:absolute;inset:0">${im('basket',2,28,50,31)}</div>
   <div class="closed" style="position:absolute;inset:0">${im('closed',2,18,50,41)}</div>
   <div class="sealed" style="position:absolute;inset:0">${im('sealed',-11,6,77,51)}</div></div>`;}
 if(s.cargo==='c06'){return `<div class="cargo c06" style="left:${s.cx}px;top:${s.cy}px;width:64px;height:43px">
   ${im('puff',-14.7,20.1,24,16,'p2','transform-origin:50% 50%')}${im('puff',-14.7,20.1,24,16,'p1','transform-origin:50% 50%')}
   <div class="body" style="position:absolute;inset:0">${im('truck',-10.2,1,86,43)}${im('logo',16.5,13.2,13.7,13.9)}</div>
   ${im('wheel',9.55,27.7,14.8,14.3,'wh')}${im('wheel',37.75,27.7,14.8,14.3,'wh')}</div>`;}
 if(s.cargo==='cAR'){return `<div class="cargo cAR" style="left:${s.cx}px;top:${s.cy}px;width:77px;height:51px"><div class="box" style="position:absolute;inset:0;transform-origin:50% 100%">${im('sealed',0,0,77,51)}</div></div>`;}
 return '';
}
function miniThumb(k){
 if(k==='full')return `${im('lettuce',3,0,15,15,'','transform:rotate(-4deg)')}${im('carrot',9,1,11,14,'','transform:rotate(5deg)')}${im('tomato',15,3,12,12.5)}${im('basket',0.5,14,28,17.6)}`;
 if(k==='start')return `${im('carrot',11,5,11,14,'','transform:rotate(5deg)')}${im('lettuce',4,11,15,15,'','transform:rotate(-6deg)')}${im('tomato',15,17,12,12.5)}${im('basket',1,15.5,30,18.6)}`;
 if(k==='sealed')return im('sealed',-8,4,48,32);
 if(k==='truck')return `${im('truck',-2,6,42,21)}${im('logo',11,12,7,7)}${im('wheel',8.5,19,7.2,7)}${im('wheel',22,19,7.2,7)}`;
 return '';
}
function row(r,kind){
 const lead=r.date?`<div class="tdate"><small>${r.date[0]}</small><b>${r.date[1]}</b></div>`:`<div class="ticon">${svgI(r.icon)}</div>`;
 const tail=kind==='now'?`<button class="pill">${r.b}</button>`:`<button class="link">${r.l}${chev('#8E9196')}</button>`;
 return `<div class="row">${lead}<div class="ttext"><b>${r.t}</b><span class="${r.warn?'warn':''}">${r.s}</span></div>${tail}</div>`;
}
function rail(s){
 let m='';
 for(const k of s.marks){
  if(k.type==='pin')m+=`<div class="pin" style="left:${k.x}px;top:13px"><span>${k.text}</span><svg width="13" height="17" viewBox="0 0 13 17"><path d="M6.5 16.5 1.3 9.3A6.5 6.5 0 1 1 11.7 9.3Z" fill="#fff"/></svg></div>`;
  if(k.type==='tick')m+=`<i class="tick" style="left:${k.x}px"></i>`;
  if(k.type==='passed')m+=`<i class="passed" style="left:${k.x}px"></i>`;
 }
 return `<div class="rail"><i class="base"></i><i class="prog" style="width:${s.prog}px"></i>${m}
  <span class="arrival"><svg width="11" height="11" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3Z" fill="#fff"/></svg></span>
  ${cargo(s)}<span class="cap">${s.cap}</span></div>`;
}
let chipIdx=0,bIdx=0,bTimer=null,cdTimer=null,cur=1;
function productsHTML(set){return set.map(k=>{const p=PRODUCTS[k];return `<div class="card fade-in"><div class="im"><img src="${IMG[k]}" alt="${p[0]}">${p[4]?'<span class="new">신제품</span>':''}</div><div class="nm">${p[0]}<br>${p[1]}</div><div class="pr">${p[2]}</div><div class="ds">${p[3]}</div></div>`;}).join('');}
function render(i){
 cur=i;const s=STATES[i];
 document.getElementById('cartBadge').textContent=s.cart;document.getElementById('cartBadge').hidden=!s.cart;
 const now=s.now.length?`<div class="now"><div class="task-card">${s.now.map(r=>row(r,'now')).join('')}</div></div>`:'';
 document.getElementById('home').innerHTML=`
  <div class="sec-title first">지금 할 일 <span class="cnt">${s.count}</span></div>
  <div class="hero-wrap"><section class="hero" id="hero">
   <div class="label"><i></i>${s.label}</div>
   <h2>${s.head}</h2>
   <div class="nums"><div class="l"><small>${s.lk}</small><b>${s.lv}</b></div><div class="r"><small>${s.rk}</small><b>${s.rv}</b></div></div>
   ${rail(s)}
   <div class="actions"><button class="btn primary">${s.btn1} <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="btn secondary">${s.btn2}</button></div>
   <div class="insight"><span class="wchip"><span class="wx"><img src="${IMG.cloud}" alt=""><i></i><i></i><i></i></span>내일 비 70%</span><span class="txt">부침가루 주문이 평소보다 늘고 있어요</span>${chev('#111')}</div>
  </section></div>
  ${now}
  <div class="banner-wrap"><div class="banner" id="banner"><div class="btrack" id="btrack">${[...BANNERS,BANNERS[0]].map(b=>`<div class="slide" style="background:${b.bg}"><span class="tag">${b.tag}</span><h3>${b.h}</h3><p>${b.p}</p><div class="circle"><img src="${IMG[b.img]}" alt=""></div></div>`).join('')}</div>
   <div class="bctl"><button id="bprev" aria-label="이전 배너"><svg width="8" height="10" viewBox="0 0 8 10"><path d="M6 1 2 5l4 4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="bpage">1 | 3</span><button id="bpause" aria-label="자동 넘김 멈춤"><svg width="8" height="10" viewBox="0 0 8 10"><rect x="1" y="1" width="2" height="8" fill="#fff"/><rect x="5" y="1" width="2" height="8" fill="#fff"/></svg></button><button id="bnext" aria-label="다음 배너"><svg width="8" height="10" viewBox="0 0 8 10"><path d="m2 1 4 4-4 4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div>
  <div class="sec-title">미리 챙겨 두세요 <span class="cnt">3건</span></div>
  <div class="soon">${SOON.map(r=>row(r,'soon')).join('')}</div>
  <div class="sec-title">지금 담기 좋아요 <span class="more">전체보기${chev('#8E9196')}</span></div>
  <div class="chips" id="chips">${CHIPS.map((c,j)=>`<button class="chip" aria-pressed="${j===chipIdx}" data-j="${j}"><span class="th"><img src="${IMG[c.img]}" alt=""></span><span><b>${c.t}</b><span>${c.s}</span></span></button>`).join('')}</div>
  <div class="grid" id="grid">${productsHTML(CHIPS[chipIdx].set)}</div>
  <div class="spacer"></div>`;
 const mini=document.getElementById('mini');
 mini.innerHTML=`<span class="mth">${miniThumb(s.mini.thumb)}</span><span class="mtx">${s.mini.html}</span><span class="bar"><i style="width:${s.mini.bar}%"></i></span>${chev('#111')}`;
 document.querySelectorAll('.time-btn,.sheet .time-btn').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===i)));
 document.getElementById('sceneK').textContent=`${s.t} · ${s.name}`;document.getElementById('sceneV').textContent=s.scene;
 document.getElementById('fabT').textContent=s.t;
 document.getElementById('scroll').scrollTop=0;if(isM())window.scrollTo(0,0);mini.classList.remove('on');
 bindHome();startCountdown();startCargo();
}
const isM=()=>matchMedia('(max-width:760px)').matches;
function hScroll(el){
 if(!el)return;let down=false,sx=0,sl=0,moved=0;
 el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){const max=el.scrollWidth-el.clientWidth;const nx=el.scrollLeft+e.deltaY;if((e.deltaY>0&&el.scrollLeft<max-1)||(e.deltaY<0&&el.scrollLeft>0)){el.scrollLeft=Math.max(0,Math.min(max,nx));e.preventDefault();}}},{passive:false});
 el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=0;sx=e.clientX;sl=el.scrollLeft;});
 window.addEventListener('pointermove',e=>{if(!down)return;const k=(el.getBoundingClientRect().width/el.offsetWidth)||1;const dx=(e.clientX-sx)/k;moved=Math.max(moved,Math.abs(dx));if(moved>4)el.classList.add('drag');el.scrollLeft=sl-dx;});
 window.addEventListener('pointerup',()=>{if(!down)return;down=false;setTimeout(()=>el.classList.remove('drag'),0);});
}
function bindHome(){
 const sc=document.getElementById('scroll'),hero=document.getElementById('hero'),mini=document.getElementById('mini');
 if(window._io)window._io.disconnect();
 window._io=new IntersectionObserver(([e])=>{mini.classList.toggle('on',!e.isIntersecting)},{root:isM()?null:sc,threshold:0,rootMargin:'0px 0px -132px 0px'});
 window._io.observe(hero);
 hScroll(document.getElementById('chips'));
 document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{chipIdx=+c.dataset.j;document.querySelectorAll('#chips .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===c)));document.getElementById('grid').innerHTML=productsHTML(CHIPS[chipIdx].set);});
 bIdx=0;setBanner(0,false);clearInterval(bTimer);let paused=false;
 bTimer=setInterval(()=>{if(!paused)nextBanner();},3000);
 document.getElementById('bnext').onclick=()=>nextBanner();
 document.getElementById('bprev').onclick=()=>{setBanner((bIdx+2)%3,false);};
 document.getElementById('bpause').onclick=e=>{paused=!paused;e.currentTarget.style.opacity=paused?.5:1;};
}
function setBanner(i,anim=true){const t=document.getElementById('btrack');if(!t)return;t.style.transition=anim?'':'none';bIdx=i;t.style.transform=`translateX(${-i*100}%)`;document.getElementById('bpage').textContent=`${(i%3)+1} | 3`;if(!anim){t.offsetWidth;t.style.transition='';}}
function nextBanner(){const n=bIdx+1;setBanner(n,true);if(n===3){setTimeout(()=>setBanner(0,false),470);}}
function startCountdown(){clearInterval(cdTimer);const el=document.getElementById('cd');if(!el)return;let sec=1*3600+58*60;cdTimer=setInterval(()=>{sec=Math.max(0,sec-1);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s2=sec%60;el.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s2).padStart(2,'0')}`;},1000);}
document.getElementById('mini').onclick=()=>(isM()?window:document.getElementById('scroll')).scrollTo({top:0,behavior:'smooth'});
// panel
const timesHTML=STATES.map((s,i)=>`<button class="time-btn" data-i="${i}" aria-pressed="false"><span class="t">${s.t.replace(':','<i>:</i>')}</span><span class="d"><b>${s.name}</b>${s.desc}</span></button>`).join('');
document.getElementById('times').innerHTML=timesHTML;document.getElementById('sheetInner').innerHTML=timesHTML;
document.querySelectorAll('.time-btn').forEach(b=>b.onclick=()=>{render(+b.dataset.i);document.getElementById('sheet').hidden=true;});
(()=>{const b=document.getElementById('fsBtn'),r=document.documentElement;const req=r.requestFullscreen||r.webkitRequestFullscreen;const on=document.fullscreenEnabled||document.webkitFullscreenEnabled;
 if(!req||!on)return;b.hidden=false;
 b.onclick=()=>{const p=req.call(r);if(p&&p.catch)p.catch(()=>{b.hidden=true;});};
 const upd=()=>{b.hidden=!!(document.fullscreenElement||document.webkitFullscreenElement);};document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);})();
document.getElementById('home').addEventListener('click',e=>{if(e.target.closest('#hero'))render((cur+1)%STATES.length);});
document.getElementById('fab').onclick=()=>document.getElementById('sheet').hidden=false;
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.hidden=true;};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')render((cur+1)%5);if(e.key==='ArrowLeft')render((cur+4)%5);});
function fit(){const w=document.getElementById('dwrap'),d=document.getElementById('device');if(innerWidth<=760){w.style.width='';w.style.height='';d.style.transform='';return;}const s=Math.min(1,(innerHeight-72)/844);d.style.transform=`scale(${s})`;w.style.width=390*s+'px';w.style.height=844*s+'px';}
addEventListener('resize',fit);fit();
render(1);
</script>
