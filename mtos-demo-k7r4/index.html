/* Layout: presentation stage — phone device on the left, demo control panel on the right; on phones the app fills the screen. Single deliberate light look. */
:root{
  --lime:#D2F56C; --lime-deep:#D9F84A; --navy:#2E3A4F; --orange:#FF5729; --ink:#111111;
  --sub:#8E9196; --mid:#5F6368; --icon:#4E5560; --line:#E3E6EA; --gray:#F2F2F2; --chipline:#E9ECF1;
  --stage:#A39F9A; --stage-ink:#23272E; --panel:#FFFFFF;
  --font:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:88px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device-wrap{flex:none;position:relative}
.device{width:390px;height:844px;border-radius:52px;transform-origin:top left;position:absolute;left:0;top:0;}
.device::before{display:none}
.device .btn-side,.island{display:none}
.device .btn-side{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#1A1B1D,#4A4B4F,#1A1B1D)}
.device .b1{left:-3px;top:150px;height:34px}.device .b2{left:-3px;top:215px;height:62px}.device .b3{left:-3px;top:290px;height:62px}.device .b4{right:-3px;top:250px;height:96px}
.screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#fff;z-index:1}
.island{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:20}
.island::after{content:"";position:absolute;right:22px;top:12px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#2B3A55,#0A0D14 60%)}
.panel{width:340px;flex:none;display:flex;flex-direction:column;gap:22px}
.panel h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.25;text-wrap:balance}
.panel .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:#4A5530;text-transform:uppercase;margin-bottom:6px}
.panel p{margin:0;font-size:14px;line-height:1.6;color:#4B5563}
.times{display:flex;flex-direction:column;gap:8px}
.time-btn{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:12px;text-align:left;background:var(--panel);border-radius:16px;padding:12px 14px;border:1.5px solid transparent;transition:border-color .15s,background .15s}
.time-btn .t{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.time-btn .d{font-size:13px;font-weight:600;color:#4B5563;line-height:1.35}
.time-btn .d b{display:block;color:var(--ink);font-size:15px;font-weight:700}
.time-btn[aria-pressed="true"]{border-color:var(--navy);background:#fff;box-shadow:0 6px 18px rgba(46,58,79,.12)}
.time-btn[aria-pressed="true"] .t{color:var(--navy)}
.time-btn:hover{border-color:#C8CDD4}
/* presentation panel — warm gray stage, pill time buttons */
.panel{width:308px;gap:18px}
.panel h1{font-size:24px;font-weight:600;color:#F7F5F2;letter-spacing:-.02em;padding-left:12px}
.panel .times{gap:12px}
.panel .time-btn{grid-template-columns:auto 1fr;gap:28px;height:80px;padding:0 30px;border-radius:40px;border:0;background:#D2CFCB;box-shadow:none;transition:background .2s}
.panel .time-btn .t{font-size:27px;font-weight:600;color:#A29E99;letter-spacing:0}
.panel .time-btn .t i{font-style:normal;padding:0 3px;position:relative;top:-2px}
.panel .time-btn .d{font-size:12px;font-weight:500;color:#A29E99;line-height:1.4}
.panel .time-btn .d b{font-size:18px;font-weight:700;color:#A29E99;margin-bottom:1px}
.panel .time-btn:hover{background:#DCD9D6}
.panel .time-btn[aria-pressed="true"]{background:#fff}
.panel .time-btn[aria-pressed="true"] .t,.panel .time-btn[aria-pressed="true"] .d,.panel .time-btn[aria-pressed="true"] .d b{color:#111}
.scene{background:var(--navy);color:#fff;border-radius:18px;padding:16px 18px}
.scene .k{font-size:12px;font-weight:700;color:var(--lime);margin-bottom:6px}
.scene .v{font-size:14px;line-height:1.6}
.hint{font-size:12px;color:#4A5530}
.hint kbd{font-family:inherit;background:#fff;border-radius:6px;padding:1px 6px;border:1px solid #D5D8DD}

/* ---------- app ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.statusbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;font-size:16px;font-weight:600;background:#fff;z-index:5}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:10px 22px 0 26px}
.store{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.hicons{display:flex;gap:18px;align-items:center}
.hicon{position:relative;width:26px;height:26px;display:grid;place-items:center}
.hicon .dot{position:absolute;top:1px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--orange);border:1.5px solid #fff}
.hicon .badge{position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.sec-title{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:800;letter-spacing:-.03em;padding:50px 26px 22px}
.sec-title.first{padding-top:18px;padding-bottom:14px}
.sec-title .cnt{color:var(--orange)}
.sec-title .more{margin-left:auto;font-size:14px;font-weight:500;color:var(--sub);display:flex;align-items:center;gap:2px;letter-spacing:0}

/* hero */
.hero-wrap{padding:0 22px}
.hero{background:var(--lime);border-radius:30px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.hero .label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.13)}
.hero .label i{width:6px;height:6px;border-radius:50%;background:var(--orange);flex:none}
.hero h2{margin:0;font-size:23px;line-height:1.36;font-weight:700;letter-spacing:-.03em}
.nums{display:flex;justify-content:space-between;align-items:flex-end}

  <div class="banner-wrap"><div class="banner" id="banner"><div class="btrack" id="btrack">${[...BANNERS,BANNERS[0]].map(b=>`<div class="slide" style="background:${b.bg}"><span class="tag">${b.tag}</span><h3>${b.h}</h3><p>${b.p}</p><div class="circle"><img src="${IMG[b.img]}" alt=""></div></div>`).join('')}</div>
   <div class="bctl"><button id="bprev" aria-label="이전 배너"><svg width="8" height="10" viewBox="0 0 8 10"><path d="M6 1 2 5l4 4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="bpage">1 | 3</span><button id="bpause" aria-label="자동 넘김 멈춤"><svg width="8" height="10" viewBox="0 0 8 10"><rect x="1" y="1" width="2" height="8" fill="#fff"/><rect x="5" y="1" width="2" height="8" fill="#fff"/></svg></button><button id="bnext" aria-label="다음 배너"><svg width="8" height="10" viewBox="0 0 8 10"><path d="m2 1 4 4-4 4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div>
  <div class="sec-title">미리 챙겨 두세요 <span class="cnt">3건</span></div>
  <div class="soon">${SOON.map(r=>row(r,'soon')).join('')}</div>
  <div class="sec-title">지금 담기 좋아요 <span class="more">전체보기${chev('#8E9196')}</span></div>
  <div class="chips" id="chips">${CHIPS.map((c,j)=>`<button class="chip" aria-pressed="${j===chipIdx}" data-j="${j}"><span class="th"><img src="${IMG[c.img]}" alt=""></span><span><b>${c.t}</b><span>${c.s}</span></span></button>`).join('')}</div>
  <div class="grid" id="grid">${productsHTML(CHIPS[chipIdx].set)}</div>
  <div class="spacer"></div>`;
 const mini=document.getElementById('mini');
 mini.innerHTML=`<span class="mth">${miniThumb(s.mini.thumb)}</span><span class="mtx">${s.mini.html}</span><span class="bar"><i style="width:${s.mini.bar}%"></i></span>${chev('#111')}`;
 document.querySelectorAll('.time-btn,.sheet .time-btn').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===i)));
 document.getElementById('sceneK').textContent=`${s.t} · ${s.name}`;document.getElementById('sceneV').textContent=s.scene;
 document.getElementById('fabT').textContent=s.t;
 document.getElementById('scroll').scrollTop=0;if(isM())window.scrollTo(0,0);mini.classList.remove('on');
 bindHome();startCountdown();startCargo();
}
const isM=()=>matchMedia('(max-width:760px)').matches;
function hScroll(el){
 if(!el)return;let down=false,sx=0,sl=0,moved=0;
 el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){const max=el.scrollWidth-el.clientWidth;const nx=el.scrollLeft+e.deltaY;if((e.deltaY>0&&el.scrollLeft<max-1)||(e.deltaY<0&&el.scrollLeft>0)){el.scrollLeft=Math.max(0,Math.min(max,nx));e.preventDefault();}}},{passive:false});
 el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=0;sx=e.clientX;sl=el.scrollLeft;});
 window.addEventListener('pointermove',e=>{if(!down)return;const k=(el.getBoundingClientRect().width/el.offsetWidth)||1;const dx=(e.clientX-sx)/k;moved=Math.max(moved,Math.abs(dx));if(moved>4)el.classList.add('drag');el.scrollLeft=sl-dx;});
 window.addEventListener('pointerup',()=>{if(!down)return;down=false;setTimeout(()=>el.classList.remove('drag'),0);});
}
function bindHome(){
 const sc=document.getElementById('scroll'),hero=document.getElementById('hero'),mini=document.getElementById('mini');
 if(window._io)window._io.disconnect();
 window._io=new IntersectionObserver(([e])=>{mini.classList.toggle('on',!e.isIntersecting)},{root:isM()?null:sc,threshold:0,rootMargin:'0px 0px -132px 0px'});
 window._io.observe(hero);
 hScroll(document.getElementById('chips'));
 document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{chipIdx=+c.dataset.j;document.querySelectorAll('#chips .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===c)));document.getElementById('grid').innerHTML=productsHTML(CHIPS[chipIdx].set);});
 bIdx=0;setBanner(0,false);clearInterval(bTimer);let paused=false;
 bTimer=setInterval(()=>{if(!paused)nextBanner();},3000);
 document.getElementById('bnext').onclick=()=>nextBanner();
 document.getElementById('bprev').onclick=()=>{setBanner((bIdx+2)%3,false);};
 document.getElementById('bpause').onclick=e=>{paused=!paused;e.currentTarget.style.opacity=paused?.5:1;};
}
function setBanner(i,anim=true){const t=document.getElementById('btrack');if(!t)return;t.style.transition=anim?'':'none';bIdx=i;t.style.transform=`translateX(${-i*100}%)`;document.getElementById('bpage').textContent=`${(i%3)+1} | 3`;if(!anim){t.offsetWidth;t.style.transition='';}}
function nextBanner(){const n=bIdx+1;setBanner(n,true);if(n===3){setTimeout(()=>setBanner(0,false),470);}}
function startCountdown(){clearInterval(cdTimer);const el=document.getElementById('cd');if(!el)return;let sec=1*3600+58*60;cdTimer=setInterval(()=>{sec=Math.max(0,sec-1);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s2=sec%60;el.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s2).padStart(2,'0')}`;},1000);}
document.getElementById('mini').onclick=()=>(isM()?window:document.getElementById('scroll')).scrollTo({top:0,behavior:'smooth'});
// panel
const timesHTML=STATES.map((s,i)=>`<button class="time-btn" data-i="${i}" aria-pressed="false"><span class="t">${s.t.replace(':','<i>:</i>')}</span><span class="d"><b>${s.name}</b>${s.desc}</span></button>`).join('');
document.getElementById('times').innerHTML=timesHTML;document.getElementById('sheetInner').innerHTML=timesHTML;
document.querySelectorAll('.time-btn').forEach(b=>b.onclick=()=>{render(+b.dataset.i);document.getElementById('sheet').hidden=true;});
(()=>{const b=document.getElementById('fsBtn'),r=document.documentElement;const req=r.requestFullscreen||r.webkitRequestFullscreen;const on=document.fullscreenEnabled||document.webkitFullscreenEnabled;
 if(!req||!on)return;b.hidden=false;
 b.onclick=()=>{const p=req.call(r);if(p&&p.catch)p.catch(()=>{b.hidden=true;});};
 const upd=()=>{b.hidden=!!(document.fullscreenElement||document.webkitFullscreenElement);};document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);})();
document.getElementById('fab').onclick=()=>document.getElementById('sheet').hidden=false;
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.hidden=true;};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')render((cur+1)%5);if(e.key==='ArrowLeft')render((cur+4)%5);});
function fit(){const w=document.getElementById('dwrap'),d=document.getElementById('device');if(innerWidth<=760){w.style.width='';w.style.height='';d.style.transform='';return;}const s=Math.min(1,(innerHeight-72)/844);d.style.transform=`scale(${s})`;w.style.width=390*s+'px';w.style.height=844*s+'px';}
addEventListener('resize',fit);fit();
render(1);
</script>

</body></html>
